<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="links">
            <a href="index.html">Google</a>
            <a href="images.html">Images</a>
        </div>

        <form action="https://www.google.com/search" class="container">
            <div class="title">Advanced Search</div>
            <label for="field" class="label" id="info">Search webs with </label>

            <label for="field" class="label">All these words: </label>
            <input type="text" name="as_q" class="item1">

            <label for="field" class="label">This exact word or phrase:</label>
            <input type="text" name="as_epq" class="item1">

            <label for="field" class="label">Any of these words:</label>
            <input type="text" name="as_oq" class="item1">

            <label for="field" class="label">None of these words:</label>
            <input type="text" name="as_eq" class="item1">
            
            <input type="submit" value="Google Search" class="item4" name="btnK">
        </form>
    </body>
</html>
